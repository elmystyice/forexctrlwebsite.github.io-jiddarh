<title>IceTrade — Trading Journal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Inter,system-ui,Segoe UI,sans-serif}.app{min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:235px;padding:22px 14px;background:#090909;border-right:1px solid #242424;z-index:20}.logo{display:flex;gap:10px;align-items:center;margin-bottom:28px}.mark{width:38px;height:38px;border-radius:11px;background:#d5a83d;color:#080808;display:grid;place-items:center;font-weight:900;font-size:23px}.logo b{letter-spacing:2px}.logo b span{color:#d5a83d}.logo small{display:block;color:#666;font-size:8px;letter-spacing:2px;margin-top:3px}.nav button{display:block;width:100%;padding:12px;border:0;background:none;color:#888;text-align:left;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active{background:#1d170a;color:#dfb64f}
.main{margin-left:235px}.top{height:78px;padding:0 28px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;background:#090909;position:sticky;top:0;z-index:10}.ey{font-size:9px;color:#6d6d6d;letter-spacing:2px}.top h1{font-size:18px;margin:3px 0}.market{font-size:10px;color:#777}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#53d58b;margin-right:6px}
.content{max-width:1450px;margin:auto;padding:28px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.intro h2{font-size:27px;margin:0 0 5px}.intro p{font-size:12px;color:#777;margin:0}.gold{background:#d5a83d;color:#080808;border:0;border-radius:10px;padding:11px 15px;font-weight:850;cursor:pointer}.gold:hover{filter:brightness(1.08)}
.glass{background:linear-gradient(145deg,#161616,#0c0c0c);border:1px solid #292929;border-radius:17px;box-shadow:0 18px 50px #0009}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:13px}.stat{padding:17px}.stat small{color:#777;font-size:10px}.stat strong{display:block;font-size:22px;margin-top:6px}.up{color:#55d68d}.down{color:#e07070}
.grid{display:grid;grid-template-columns:1.7fr .8fr;gap:13px}.card{padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.head h3{font-size:16px;margin:4px 0}.price{text-align:right}.price b{font-size:19px}.tf{display:flex;gap:5px;margin:13px 0}.tf button,.tool{border:1px solid #292929;background:#101010;color:#777;border-radius:7px;padding:6px 9px;font-size:9px;cursor:pointer}.tf button.active,.tool.active{background:#30250d;color:#dfb64f;border-color:#594519}
.chart{height:370px;position:relative;overflow:hidden;border-radius:11px;background:#0b0b0b}.chart canvas{width:100%;height:100%}.chart-tools{position:absolute;right:8px;top:8px;display:flex;gap:5px;z-index:2}.chart-tools button{background:#0b0b0bcc;border:1px solid #333;color:#aaa;border-radius:7px;padding:6px 8px;font-size:9px;cursor:pointer}.chart-tools button:hover{color:#d3a63d}.foot{display:flex;gap:18px;border-top:1px solid #222;margin-top:8px;padding-top:10px;color:#666;font-size:9px}.foot button{margin-left:auto;background:none;border:0;color:#d3a63d;cursor:pointer}
.routine{padding:20px}.alarm{display:flex;gap:12px;align-items:center;margin:24px 0}.bell{width:44px;height:44px;border-radius:12px;background:#211a0b;color:#d5a83d;display:grid;place-items:center}.alarm b,.alarm small{display:block}.alarm small{font-size:10px;color:#666;margin-top:4px}.progress{height:4px;background:#1b1b1b;border-radius:9px;margin:13px 0}.progress span{display:block;height:100%;background:#d5a83d}.lower{display:grid;grid-template-columns:1.1fr .9fr;gap:13px;margin-top:13px}.rows{padding:18px}.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #222}.row small{display:block;color:#666;font-size:10px;margin-top:4px}.row>span{margin-left:auto;color:#666;font-size:9px}.check{width:21px;height:21px;border:1px solid #444;border-radius:7px;display:grid;place-items:center}.done{background:#d5a83d;color:#080808;border-color:#d5a83d}.empty{text-align:center;color:#666;padding:30px}
.wizard{display:grid;gap:12px}.step{display:flex;gap:15px;padding:18px}.num{width:35px;height:35px;flex:none;border-radius:10px;background:#1a1a1a;color:#d5a83d;display:grid;place-items:center;font-weight:900}.body{width:100%}.body h3{margin:5px 0;font-size:16px}.body p{color:#777;font-size:11px}.body textarea{width:100%;min-height:85px;background:#0b0b0b;border:1px solid #292929;color:#ddd;border-radius:9px;padding:10px;resize:vertical}.choice{display:flex;gap:7px;margin:12px 0}.choice button{background:#101010;color:#888;border:1px solid #333;border-radius:9px;padding:9px;cursor:pointer}.choice button.sel{background:#2b220c;color:#dfb64f;border-color:#8c6821}.note{margin-top:13px;padding:14px;border:1px solid #3d3016;background:#171209;border-radius:12px;color:#888;font-size:10px}
.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:13px;border-bottom:1px solid #222;text-align:left;white-space:nowrap}.table th{font-size:9px;color:#666}.thumb{width:42px;height:30px;object-fit:cover;border-radius:5px;border:1px solid #333}
.report-head,.report-row{display:grid;grid-template-columns:1.2fr .65fr .7fr .8fr auto;gap:12px;align-items:center}.report-head{padding:0 0 10px;color:#666;font-size:9px;border-bottom:1px solid #333}.report-row{padding:15px 0;border-bottom:1px solid #222;font-size:10px}.report-row small{display:block;color:#666;margin-top:4px}.download{background:#15120b;color:#d5a83d;border:1px solid #5f481b;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:9px;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;color:#777;font-size:10px}.field input,.field select,.field textarea,.modal textarea{background:#0b0b0b;border:1px solid #292929;color:#ddd;border-radius:9px;padding:10px}.modalbg{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(650px,100%);padding:22px;position:relative}.close{position:absolute;right:14px;top:12px;background:none;border:0;color:#777;font-size:20px}.modal textarea{width:100%;min-height:80px}.modal label{display:grid;gap:5px;color:#777;font-size:10px;margin:10px 0}.install{position:fixed;right:18px;bottom:18px;background:#111;color:#d5a83d;border:1px solid #6a501d;border-radius:10px;padding:10px 13px;z-index:30;cursor:pointer}
.menu{display:none;background:none;border:0;color:#aaa;font-size:22px}@media(max-width:950px){.side{transform:translateX(-100%)}.main{margin-left:0}.menu{display:block}.stats{grid-template-columns:1fr 1fr}.grid,.lower{grid-template-columns:1fr}.content{padding:17px 12px}.intro{flex-direction:column;align-items:flex-start;gap:12px}.report-head,.report-row{grid-template-columns:1fr 1fr}.report-row .download{grid-column:1/-1;width:max-content}}@media(max-width:600px){.chart{height:300px}.form{grid-template-columns:1fr}}
.shot-btn{background:none;border:0;padding:0;cursor:zoom-in}.shot-btn img{display:block}.shot-modal{position:fixed;inset:0;background:#000e;display:grid;place-items:center;padding:20px;z-index:100}.shot-modal img{max-width:96vw;max-height:90vh;width:auto;height:auto;object-fit:contain;border:1px solid #555;border-radius:10px}.shot-close{position:fixed;right:20px;top:15px;border:0;background:#151515;color:#eee;border-radius:9px;width:40px;height:40px;font-size:22px;cursor:pointer}.delete-btn{background:#160d0d;color:#e07070;border:1px solid #4a2424;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:9px;font-weight:800}.delete-btn:hover{background:#281010;border-color:#713030}</style></head><body><div id="app"></div>
<script>
const KEY='icetrade_complete_v1';
const defaults={page:'dashboard',currentDay:null,todayTrades:[],steps:{},checked:false,reminderSent:null,reports:[],settings:{start:'07:00',notifications:false},screenshots:[]};
let state=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));
state.settings=Object.assign(defaults.settings,state.settings||{}); state.reports=state.reports||[]; state.todayTrades=state.todayTrades||[]; state.steps=state.steps||{};
const strategy=[
 ['MACD & Signal near Zero Line','Wait until the MACD line and Signal line are close to the Zero Line.'],
 ['Technical Analysis & Market Bias','Use technical analysis and past-data knowledge to determine the likely next market direction. Record the evidence and bias.'],
 ['1-Minute Equal Highs / Equal Lows','Move to the 1-minute chart and look for two highs or two lows that are almost equal.'],
 ['Previous Structure Entry','After the equal highs/lows occur, identify the previous structure and record the planned entry.']
];
function today(){let d=new Date();return d.toLocaleDateString('en-CA',{timeZone:'Africa/Lagos'})}
function minutesLagos(){let s=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Lagos',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());let [h,m]=s.split(':').map(Number);return h*60+m}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function page(p){state.page=p;save();render()}
function startSessionIfNeeded(){
 const d=today(), mins=minutesLagos();
 if(!state.currentDay){state.currentDay=d;save();return}
 if(d!==state.currentDay && mins>=420){archiveAndReset(d);return}
}
function archiveAndReset(newDay){
 const old=state.currentDay, trades=[...(state.todayTrades||[])];
 if(old && (trades.length||state.checked||Object.keys(state.steps).length)){
   const wins=trades.filter(t=>t.result==='WIN').length,pnl=trades.reduce((a,t)=>a+(+t.pnl||0),0);
   if(!state.reports.some(r=>r.date===old))state.reports.unshift({date:old,trades,wins,pnl,createdAt:new Date().toISOString()});
 }
 state.currentDay=newDay;state.todayTrades=[];state.steps={};state.checked=false;state.reminderSent=null;save()
}
function render(){
 startSessionIfNeeded();
 const p=state.page;
 document.getElementById('app').innerHTML=`<aside class="side"><div class="logo"><div class="mark">I</div><div><b>ICE<span>TRADE</span></b><small>TRADING JOURNAL</small></div></div><nav class="nav">${[['dashboard','◈ Dashboard'],['journal','▤ Journal'],['strategy','⚡ Strategy Guide'],['analytics','↗ Analytics'],['reports','▣ Reports'],['settings','⚙ Settings']].map(x=>`<button class="${p===x[0]?'active':''}" onclick="page('${x[0]}')">${x[1]}</button>`).join('')}</nav></aside><main class="main"><header class="top"><button class="menu" onclick="document.querySelector('.side').style.transform='translateX(0)'">☰</button><div><div class="ey">PERSONAL TRADING OS · ${state.currentDay||today()}</div><h1>${p[0].toUpperCase()+p.slice(1)}</h1></div><div class="market"><i class="dot"></i>XAUUSD</div></header>${p==='dashboard'?dashboard():p==='journal'?journal():p==='strategy'?strategyPage():p==='analytics'?analytics():p==='reports'?reports():settings()}</main>`;
}
function dashboard(){
 let t=state.todayTrades,w=t.filter(x=>x.result==='WIN').length,l=t.filter(x=>x.result==='LOSS').length,pnl=t.reduce((a,x)=>a+(+x.pnl||0),0),done=Object.values(state.steps).filter(x=>x.done).length;
 return `<section class="content"><div class="intro"><div><h2>Good morning, Trader.</h2><p>New session begins at 7:00 AM Lagos time. History stays archived.</p></div><button class="gold" onclick="page('strategy')">⚡ Start strategy guide</button></div>
 <div class="stats"><div class="glass stat"><small>Today's trades</small><strong>${t.length}</strong></div><div class="glass stat"><small>Wins / Losses</small><strong>${w} / ${l}</strong></div><div class="glass stat"><small>Strategy compliance</small><strong>${Math.round(done/4*100)}%</strong></div><div class="glass stat"><small>Daily P/L</small><strong class="${pnl>=0?'up':'down'}">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(2)}</strong></div></div>
 <div class="grid"><div class="glass card"><div class="head"><div><div class="ey">XAUUSD · LIVE-READY</div><h3>Gold / US Dollar</h3></div><div class="price"><b id="px">$3,400.00</b><div class="up">5-minute view</div></div></div><div class="tf">${['1m','5m','15m','1H'].map(x=>`<button class="${x==='5m'?'active':''}" onclick="drawChart('${x}')">${x}</button>`).join('')}</div><div class="chart"><canvas id="chart"></canvas><div class="chart-tools"><button class="tool" onclick="toggleEqualMark()">◎ Equal highs/lows</button><button class="tool" onclick="toggleStructure()">⌁ Previous structure</button></div></div><div class="foot"><span>● DEMO OHLC FEED</span><span>Real-time API ready</span><button onclick="page('journal')">Open journal →</button></div></div>
 <div class="glass routine"><div class="ey">DAILY ROUTINE</div><h3>7:00 AM Market Check</h3><div class="alarm"><div class="bell">◷</div><div><b>${state.checked?'Market check started':'Waiting for market check'}</b><small>Follow each strategy step before taking an entry.</small></div></div><button class="gold" style="width:100%" onclick="state.checked=true;save();render()">${state.checked?'✓ Session active':'Start market check'}</button><div class="progress"><span style="width:${state.checked?'100':'0'}%"></span></div><small style="color:#666">Reminder interval: 5 minutes · Snooze available</small></div></div>
 <div class="lower"><div class="glass rows"><div class="head"><h3>Strategy checklist</h3><button class="gold" onclick="page('strategy')">Open</button></div>${strategy.map((s,i)=>`<div class="row"><div class="check ${state.steps[i]?.done?'done':''}">${state.steps[i]?.done?'✓':''}</div><div><b>${i+1}. ${s[0]}</b><small>${s[1]}</small></div><span>${state.steps[i]?.done?'Done':'Pending'}</span></div>`).join('')}</div><div class="glass rows"><div class="head"><h3>Today's trades</h3><button class="gold" onclick="tradeModal()">+ Record</button></div>${t.slice(0,5).map(t=>`<div class="row"><div>AU</div><div><b>${t.pair} · ${t.direction}</b><small>${t.entry} → ${t.tp}</small></div><strong class="${(+t.pnl||0)>=0?'up':'down'}" style="margin-left:auto">${t.pnl||'0'}</strong></div>`).join('')||'<div class="empty">No trades recorded yet.</div>'}</div></div></section>`
}
function journal(){
 return `<section class="content"><div class="intro"><div><h2>Trade Journal</h2><p>Current day: ${state.currentDay}. Screenshots and notes stay with each trade.</p></div><button class="gold" onclick="tradeModal()">+ Record trade</button></div><div class="glass card table"><table><thead><tr><th>Date</th><th>Pair</th><th>Direction</th><th>Entry / SL / TP</th><th>Pattern</th><th>Screenshot</th><th>Result</th><th>P/L</th><th>Action</th></tr></thead><tbody>${state.todayTrades.map((t,i)=>`<tr><td>${t.date}</td><td>${t.pair}</td><td>${t.direction}</td><td>${t.entry} / ${t.sl} / ${t.tp}</td><td>${t.pattern||'Equal highs/lows'}</td><td>${t.image?`<button class="shot-btn" onclick="openScreenshot(this.querySelector('img').src)"><img class="thumb" src="${t.image}"></button>`:'—'}</td><td>${t.result}</td><td class="${(+t.pnl||0)>=0?'up':'down'}">${t.pnl||0}</td><td><button class="delete-btn" onclick="deleteTrade(${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No trades recorded today.</td></tr>'}</tbody></table></div></section>`
}
function strategyPage(){
 return `<section class="content"><div class="intro"><div><h2>Your Strategy Guide</h2><p>Complete the process in order. IceTrade records your evidence.</p></div></div><div class="wizard">${strategy.map((s,i)=>`<div class="glass step"><div class="num">${state.steps[i]?.done?'✓':i+1}</div><div class="body"><div class="ey">STEP ${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p>${i===0?`<div class="choice"><button class="${state.steps[i]?.answer==='yes'?'sel':''}" onclick="choice(0,'yes')">YES — CONTINUE</button><button class="${state.steps[i]?.answer==='no'?'sel':''}" onclick="choice(0,'no')">NO — WAIT</button></div>`:`<textarea id="st${i}" placeholder="${i===1?'Record direction, evidence, structure and reasoning...':i===2?'Describe the equal highs/lows and timeframe evidence...':'Describe the previous structure and planned entry...'}">${state.steps[i]?.text||''}</textarea>`}<button class="gold" onclick="saveStep(${i})">${state.steps[i]?.done?'✓ Saved':'Save step'}</button></div></div>`).join('')}</div><div class="note">IceTrade is a process and journal tool. It does not guarantee market direction, provide financial advice, or execute trades.</div></section>`
}
function choice(i,a){state.steps[i]={...(state.steps[i]||{}),answer:a,done:a==='yes'};save();render()}
function saveStep(i){let text=document.getElementById('st'+i)?.value||'';if(i>0)state.steps[i]={...(state.steps[i]||{}),text,done:true};save();render()}
function analytics(){
 let t=state.todayTrades,w=t.filter(x=>x.result==='WIN').length,p=t.reduce((a,x)=>a+(+x.pnl||0),0),all=state.reports.reduce((a,r)=>a+r.trades.length,0)+t.length;
 return `<section class="content"><div class="intro"><div><h2>Analytics</h2><p>Current session plus archived performance.</p></div></div><div class="stats"><div class="glass stat"><small>Total archived trades</small><strong>${all}</strong></div><div class="glass stat"><small>Today's win rate</small><strong>${t.length?Math.round(w/t.length*100):0}%</strong></div><div class="glass stat"><small>Today's P/L</small><strong class="${p>=0?'up':'down'}">${p>=0?'+':''}$${Math.abs(p).toFixed(2)}</strong></div><div class="glass stat"><small>Archived days</small><strong>${state.reports.length}</strong></div></div><div class="glass card"><h3>Execution review</h3><p style="color:#777;font-size:11px">Review strategy compliance, equal-high/equal-low identification, previous structure entries, and repeated mistakes in your daily reports.</p></div></section>`
}
function reports(){
 return `<section class="content"><div class="intro"><div><h2>Daily Reports</h2><p>Permanent archive — this page never resets at 7:00 AM.</p></div><button class="gold" onclick="saveTodayReport()">Save today's report</button></div><div class="note"><b>7:00 AM archive:</b> yesterday's completed session is moved here automatically. Current-day dashboard data then starts fresh. Historical reports are never deleted.</div><div class="glass card" style="margin-top:13px"><div class="report-head"><span>Date</span><span>Trades</span><span>Win rate</span><span>P/L</span><span>Download</span></div>${state.reports.map((r,i)=>{let wr=r.trades.length?Math.round(r.wins/r.trades.length*100):0;return `<div class="report-row"><div><b>${r.date}</b><small>Daily trading report · ${r.trades.filter(t=>t.image).length} screenshot${r.trades.filter(t=>t.image).length===1?'':'s'}</small></div><div>${r.trades.length}</div><div>${wr}%</div><div class="${r.pnl>=0?'up':'down'}">${r.pnl>=0?'+':''}$${Math.abs(r.pnl).toFixed(2)}</div><button class="download" onclick="downloadReport(${i})">↓ Download PDF</button></div>`}).join('')||'<div class="empty">No archived reports yet.</div>'}</div></section>`
}
function settings(){
 return `<section class="content"><div class="intro"><div><h2>Settings</h2><p>Daily routine and notification controls.</p></div></div><div class="glass card" style="max-width:680px"><h3>7:00 AM daily session</h3><p style="color:#777;font-size:11px">Timezone is fixed to Africa/Lagos so the session boundary remains consistent.</p><label class="field">Reminder time<input type="time" value="${state.settings.start}" onchange="state.settings.start=this.value;save();render()"></label><button class="gold" onclick="enableNotifications()">🔔 ${state.settings.notifications?'Notifications enabled':'Enable 5-minute reminders'}</button><div class="note">Browser notifications require permission and HTTPS when deployed. The website cannot silently write into Android Downloads; PDF export uses the device/browser Save as PDF flow.</div></div></section>`
}
function tradeModal(){
 document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="mb"><div class="modal glass"><button class="close" onclick="mb.remove()">×</button><div class="ey">NEW TRADE</div><h2>Record trade</h2><div class="form">${[['pair','Pair','XAUUSD'],['entry','Entry',''],['sl','Stop loss',''],['tp','Take profit',''],['risk','Risk %','1'],['pnl','P/L','']].map(x=>`<label class="field">${x[1]}<input id="f-${x[0]}" value="${x[2]}"></label>`).join('')}<label class="field">Direction<select id="f-direction"><option>BUY</option><option>SELL</option></select></label><label class="field">Result<select id="f-result"><option>WIN</option><option>LOSS</option><option>BREAKEVEN</option></select></label></div><label>Notes<textarea id="f-notes"></textarea></label><label>Screenshot<input id="f-image" type="file" accept="image/*"></label><button class="gold" style="width:100%" onclick="saveTrade()">Save trade</button></div></div>`)
}
function openScreenshot(src){document.body.insertAdjacentHTML('beforeend',`<div class="shot-modal" id="shotmodal" onclick="if(event.target===this)closeScreenshot()"><button class="shot-close" onclick="closeScreenshot()">×</button><img src="${src}" alt="Trading screenshot"></div>`)}
function closeScreenshot(){document.getElementById('shotmodal')?.remove()}
function deleteTrade(i){const t=state.todayTrades?.[i];if(!t)return;if(!confirm('Delete this trade from today’s journal? This cannot be undone.'))return;state.todayTrades.splice(i,1);save();render()}
function saveTrade(){
 const g=k=>document.getElementById('f-'+k).value, file=document.getElementById('f-image').files[0];
 const finish=image=>{
  const tr={date:today(),pair:g('pair'),entry:g('entry'),sl:g('sl'),tp:g('tp'),risk:g('risk'),pnl:g('pnl'),direction:g('direction'),result:g('result'),notes:g('notes'),pattern:'Equal highs/lows',image:image||''};
  state.todayTrades=state.todayTrades||[];state.todayTrades.unshift(tr);
  try{save();mb.remove();render()}catch(e){alert('The screenshot could not be saved. Try a smaller image.');console.error(e)}
 };
 if(file){
  compressScreenshot(file,finish)
 }else finish('')
}
function compressScreenshot(file,cb){
 const reader=new FileReader();reader.onload=()=>{
  const img=new Image();img.onload=()=>{
   const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL('image/jpeg',.78));
  };img.onerror=()=>cb(reader.result);img.src=reader.result;
 };reader.readAsDataURL(file)
}
function saveTodayReport(){
 const trades=[...state.todayTrades],wins=trades.filter(t=>t.result==='WIN').length,pnl=trades.reduce((a,t)=>a+(+t.pnl||0),0),d=state.currentDay||today();
 const i=state.reports.findIndex(r=>r.date===d),r={date:d,trades,wins,pnl,createdAt:new Date().toISOString()};
 if(i>=0)state.reports[i]=r;else state.reports.unshift(r);save();alert('Today’s report is now archived.');render()
}
function reportHTML(r){ let wr=r.trades.length?Math.round(r.wins/r.trades.length*100):0; return `<!doctype html><html><head><meta charset="utf-8"><title>IceTrade ${r.date}</title><style>@page{size:A4;margin:16mm}body{font-family:Arial,sans-serif;margin:0;color:#111;font-size:11px}h1{margin:0 0 3px;font-size:24px}h2{font-size:15px;margin:22px 0 10px;border-bottom:1px solid #ccc;padding-bottom:5px}.muted{color:#666}.stats{display:flex;gap:12px;margin:18px 0}.box{border:1px solid #ddd;padding:10px 14px;min-width:110px}.box b{font-size:16px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left;font-size:9px;vertical-align:top}.screens{display:grid;grid-template-columns:1fr 1fr;gap:18px}.screen{break-inside:avoid;border:1px solid #ddd;padding:10px}.screen img{display:block;max-width:100%;max-height:250px;width:auto;height:auto;object-fit:contain;margin:8px auto}.caption{font-size:9px;color:#555}</style></head><body><h1>ICETRADE</h1><div class="muted">DAILY TRADING REPORT · ${r.date}</div><div class="stats"><div class="box">Trades<br><b>${r.trades.length}</b></div><div class="box">Win rate<br><b>${wr}%</b></div><div class="box">P/L<br><b>${r.pnl>=0?'+':''}$${Math.abs(r.pnl).toFixed(2)}</b></div></div><h2>Trade Log</h2><table><tr><th>Pair</th><th>Direction</th><th>Entry</th><th>SL</th><th>TP</th><th>Result</th><th>P/L</th><th>Notes</th></tr>${r.trades.map(t=>`<tr><td>${t.pair}</td><td>${t.direction}</td><td>${t.entry}</td><td>${t.sl}</td><td>${t.tp}</td><td>${t.result}</td><td>${t.pnl}</td><td>${t.notes||''}</td></tr>`).join('')}</table><h2>Trading Screenshots</h2><div class="screens">${r.trades.filter(t=>t.image).map((t,i)=>`<div class="screen"><b>Trade ${i+1} · ${t.pair} · ${t.direction}</b><div class="caption">Entry ${t.entry} · SL ${t.sl} · TP ${t.tp} · ${t.result}</div><img src="${t.image}"><div class="caption">${t.notes||'Trading screenshot'}</div></div>`).join('')||'<div class="muted">No screenshots were attached to this report.</div>'}</div></body></html>`}
function downloadReport(i){let r=state.reports[i];if(!r)return;let w=window.open('','_blank');w.document.write(reportHTML(r));w.document.close();setTimeout(()=>w.print(),400)}
function enableNotifications(){if(!('Notification'in window)){alert('Notifications are not supported here.');return}Notification.requestPermission().then(x=>{state.settings.notifications=x==='granted';save();render()})}
function maybeReminder(){
 const mins=minutesLagos(),d=today();
 if(mins>=420 && mins<425 && state.reminderSent!==d && state.settings.notifications && 'Notification'in window && Notification.permission==='granted'){
   new Notification('IceTrade — 7:00 AM Market Check',{body:'Your new trading session has started. Follow the strategy step-by-step.'});
   state.reminderSent=d;save()
 }
}
let chartTf='5m',equalMark=false,structureMark=false;
function makeCandles(n=72){let p=3400,a=[],now=Date.now();let m=chartTf==='1m'?1:chartTf==='5m'?5:chartTf==='15m'?15:60;for(let i=0;i<n;i++){let o=p,c=o+(Math.random()-.48)*8,h=Math.max(o,c)+Math.random()*5+1,l=Math.min(o,c)-Math.random()*5-1;a.push({o,c,h,l,time:new Date(now-(n-i)*m*60000)});p=c}return a}
function drawChart(tf='5m'){chartTf=tf;let c=document.getElementById('chart');if(!c)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let W=r.width,H=r.height,a=makeCandles(),min=Math.min(...a.map(v=>v.l)),max=Math.max(...a.map(v=>v.h)),pl=8,pr=62,pt=12,pb=25,cw=W-pl-pr,ch=H-pt-pb,y=v=>pt+(max-v)/(max-min)*ch,step=cw/a.length;x.fillStyle='#0b0b0b';x.fillRect(0,0,W,H);x.strokeStyle='#1e1e1e';for(let i=1;i<6;i++){let yy=pt+i*ch/6;x.beginPath();x.moveTo(pl,yy);x.lineTo(W-pr,yy);x.stroke()}for(let i=1;i<8;i++){let xx=pl+i*cw/8;x.beginPath();x.moveTo(xx,pt);x.lineTo(xx,pt+ch);x.stroke()}a.forEach((v,i)=>{let cx=pl+i*step+step/2,up=v.c>=v.o;x.strokeStyle=x.fillStyle=up?'#55d68d':'#e07070';x.beginPath();x.moveTo(cx,y(v.h));x.lineTo(cx,y(v.l));x.stroke();x.fillRect(cx-Math.max(2,step*.31),Math.min(y(v.o),y(v.c)),Math.max(3,step*.62),Math.max(1,Math.abs(y(v.c)-y(v.o))))});let last=a.at(-1).c,ly=y(last);x.setLineDash([5,4]);x.strokeStyle='#d5a83d';x.beginPath();x.moveTo(pl,ly);x.lineTo(W-pr,ly);x.stroke();x.setLineDash([]);x.fillStyle='#d5a83d';x.fillRect(W-pr+3,ly-10,pr-8,20);x.fillStyle='#080808';x.font='10px system-ui';x.fillText(last.toFixed(2),W-pr+7,ly+4);if(equalMark){let i=a.length-19,j=a.length-8,yy=(y(a[i].h)+y(a[j].h))/2;x.strokeStyle='#e5b84d';x.setLineDash([3,3]);x.beginPath();x.moveTo(pl+i*step,yy);x.lineTo(pl+j*step,yy);x.stroke();x.setLineDash([]);x.fillStyle='#e5b84d';x.fillText('EQUAL HIGH',pl+i*step,yy-7)}if(structureMark){let i=a.length-28,yy=y(a[i].l);x.strokeStyle='#9c7a2e';x.lineWidth=2;x.beginPath();x.moveTo(pl+i*step,yy);x.lineTo(W-pr,yy);x.stroke();x.fillStyle='#9c7a2e';x.font='10px system-ui';x.fillText('PREVIOUS STRUCTURE',pl+i*step,yy-7)}document.getElementById('px').textContent='$'+last.toFixed(2)}
function toggleEqualMark(){equalMark=!equalMark;drawChart(chartTf)}function toggleStructure(){structureMark=!structureMark;drawChart(chartTf)}
if('serviceWorker'in navigator){const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());`;try{let b=new Blob([sw],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{})}catch(e){}}
setInterval(()=>{startSessionIfNeeded();maybeReminder();},1000);render();setTimeout(()=>drawChart('5m'),80);window.addEventListener('resize',()=>drawChart(chartTf));
